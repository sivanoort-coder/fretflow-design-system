<body>
<div id="root"></div>
<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="hybrid"
        title="Riso × Score — the hybrid"
        subtitle="Two-color riso print of an editorial sheet-music page. Ultramarine ink + spot orange, paper grain, deliberate misregistration. Sheet-music vocabulary kept intact (staves, treble clef, italic captions, roman-numeral measure counts, tempo marks); huge condensed display type crashes against delicate Garamond italics for editorial contrast.">
        <DCArtboard id="h-today"    label="Today"    width={320} height={640}><HybridToday/></DCArtboard>
        <DCArtboard id="h-practice" label="Practice" width={320} height={640}><HybridPractice/></DCArtboard>
        <DCArtboard id="h-review"   label="Review"   width={320} height={640}><HybridReview/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
