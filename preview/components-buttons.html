<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; }
  body { background: var(--paper-100); color: var(--ink-700); font-family: var(--font-body); padding: 28px; }
  h1 { font-family: var(--font-heading); font-weight: 500; font-size: 38px; line-height: 1; letter-spacing: -0.02em; margin: 0 0 4px; }
  .sub { font-family: var(--font-editorial); font-style: italic; font-size: 16px; color: var(--ink-500); margin-bottom: 22px; max-width: 60ch; }
  .lbl { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-500); margin: 18px 0 8px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    padding: 16px 22px;
    border-radius: 14px;
    border: 0;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -0.01em;
    cursor: pointer;
  }
  .btn .arr { font-family: var(--font-editorial); font-style: italic; font-weight: 400; font-size: 22px; }
  .btn-primary { background: var(--ink-700); color: var(--paper-100); box-shadow: 4px 4px 0 var(--spot-700); }
  .btn-pressed { background: var(--ink-700); color: var(--paper-100); box-shadow: 0 0 0 var(--spot-700); transform: translate(4px, 4px); }
  .btn-ghost   { background: transparent; color: var(--ink-700); border: 1.5px solid var(--ink-700); }
  .btn-disabled{ opacity: 0.4; pointer-events: none; }
</style></head><body>
<h1>Buttons.</h1>
<div class="sub">Sentence case in daily UI. Primary CTA carries a hard 4×4 orange block shadow. Pressed state collapses it to zero — the button "settles" onto the page. Ghost is the only secondary.</div>

<div class="lbl">PRIMARY · WITH ARROW</div>
<button class="btn btn-primary">Begin practice <span class="arr">→</span></button>

<div class="lbl">PRIMARY · PRESSED</div>
<button class="btn btn-pressed">Begin practice <span class="arr">→</span></button>

<div class="lbl">GHOST</div>
<button class="btn btn-ghost">Drill the miss</button>

<div class="lbl">DISABLED</div>
<button class="btn btn-primary btn-disabled">Begin practice <span class="arr">→</span></button>
</body></html>
