<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; }
  body { background: var(--paper-100); color: var(--ink-700); font-family: var(--font-body); padding: 28px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 32px; letter-spacing: -0.04em; margin: 0 0 4px; }
  .sub { font-family: var(--font-editorial); font-style: italic; font-size: 15px; color: var(--ink-500); margin-bottom: 22px; }
  .lbl { font-family: var(--font-mono); font-size: 9px; font-weight:700; letter-spacing: 0.18em; color: var(--ink-500); margin: 0 0 10px; text-transform: uppercase; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 22px; }

  /* Linear progress — staff bar with note bubble */
  .staff { width: 100%; height: 14px; background: var(--paper-200); border: 1.5px solid var(--ink-700); position: relative; }
  .staff::before { content: ''; position: absolute; left: 0; top: 50%; height: 1.5px; background: var(--ink-700); transform: translateY(-50%); }
  .staff .fill { background: var(--ink-700); height: 100%; }
  .staff .fill.spot { background: var(--spot-700); }
  .staff .head { position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 18px; height: 18px; border-radius: 999px; background: var(--spot-700); border: 1.5px solid var(--ink-700); }

  /* Step progress */
  .steps { display: flex; gap: 4px; align-items: center; }
  .steps .step { flex: 1; height: 8px; border: 1.5px solid var(--ink-700); background: var(--paper-50); }
  .steps .step.done { background: var(--ink-700); }
  .steps .step.now  { background: var(--spot-700); }

  /* Streak dots — fourteen days, last is today */
  .streak { display: flex; gap: 6px; align-items: flex-end; }
  .streak .dot { width: 14px; height: 14px; border-radius: 999px; border: 1.5px solid var(--ink-700); background: var(--paper-50); }
  .streak .dot.done { background: var(--ink-700); }
  .streak .dot.today { background: var(--spot-700); width: 20px; height: 20px; }

  /* Big mono counter */
  .counter {
    font-family: var(--font-display); font-weight: 700; font-size: 64px; letter-spacing: -0.05em;
    color: var(--ink-700); line-height: 0.85;
  }
  .counter .of {
    font-family: var(--font-editorial); font-style: italic; font-weight: 400; font-size: 22px;
    color: var(--ink-500); letter-spacing: 0;
  }
</style></head><body>
<h1>Progress.</h1>
<div class="sub">Hard rules, square fills. Round only on the moving note bubble.</div>

<div class="lbl">STAFF BAR &mdash; ink fill</div>
<div class="staff" style="margin-bottom: 22px;">
  <div class="fill" style="width: 62%;"></div>
  <div class="head" style="left: 62%;"></div>
</div>

<div class="lbl">STAFF BAR &mdash; spot fill</div>
<div class="staff" style="margin-bottom: 22px;">
  <div class="fill spot" style="width: 38%;"></div>
  <div class="head" style="left: 38%; background: var(--ink-700);"></div>
</div>

<div class="lbl">STEPS &mdash; lesson 3 of 7</div>
<div class="steps" style="margin-bottom: 22px;">
  <div class="step done"></div><div class="step done"></div><div class="step now"></div>
  <div class="step"></div><div class="step"></div><div class="step"></div><div class="step"></div>
</div>

<div class="lbl">STREAK &mdash; fourteen days</div>
<div class="streak" style="margin-bottom: 22px;">
  <div class="dot done"></div><div class="dot done"></div><div class="dot done"></div><div class="dot done"></div>
  <div class="dot done"></div><div class="dot done"></div><div class="dot done"></div><div class="dot done"></div>
  <div class="dot done"></div><div class="dot done"></div><div class="dot done"></div><div class="dot done"></div>
  <div class="dot done"></div><div class="dot today"></div>
</div>

<div class="lbl">COUNTER</div>
<div class="counter">14<span class="of"> &nbsp;of 30</span></div>
</body></html>
