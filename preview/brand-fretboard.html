<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; }
  body { background: var(--paper-100); color: var(--ink-700); font-family: var(--font-body); padding: 28px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 32px; letter-spacing: -0.04em; margin: 0 0 4px; }

  .cap { font-family: var(--font-editorial); font-style: italic; font-size: 13px; color: var(--ink-500); text-align: center; margin-top: 12px; }
</style></head><body>
<h1>Fretboard motif.</h1>
<div class="sub">A score-fragment, not a guitar diagram. Used as quiet ornament on hero surfaces.</div>
<div class="stage">
  <img src="../assets/fretboard-illustration.svg" style="width:100%;max-width:680px;height:auto;display:block;margin:0 auto;" alt="">
</div>
<div class="cap">measure i &mdash; <span style="color: var(--spot-700);">andante, calmly.</span></div>
</body></html>
