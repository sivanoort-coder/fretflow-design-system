<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; padding:0; }
  body { background: var(--paper-100); color: var(--ink-700); font-family: var(--font-body); padding: 28px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 32px; letter-spacing: -0.04em; margin: 0 0 4px; }
  .sub { font-family: var(--font-editorial); font-style: italic; font-size: 15px; color: var(--ink-500); margin-bottom: 22px; }
  .lbl { font-family: var(--font-mono); font-size: 9px; font-weight:700; letter-spacing: 0.18em; color: var(--ink-500); margin: 0 0 8px; text-transform: uppercase; }
  .stack { display: flex; flex-direction: column; gap: 18px; }

  /* Inline label — small caps mono above the field */
  .field { display: flex; flex-direction: column; gap: 6px; }

  /* Default ruled input — staff line under the type */
  .ruled {
    background: transparent; border: 0; border-bottom: 1.5px solid var(--ink-700);
    padding: 8px 0;
    font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.03em;
    color: var(--ink-700); width: 100%;
  }
  .ruled:focus { outline: 0; border-bottom: 2.5px solid var(--spot-700); }
  .ruled::placeholder { color: var(--ink-300); font-style: italic; font-family: var(--font-editorial); font-weight: 400; letter-spacing: 0; }

  /* Boxed input — for tighter forms */
  .boxed {
    background: var(--paper-50); border: 1.5px solid var(--ink-700);
    padding: 12px 14px;
    font-family: var(--font-body); font-size: 16px;
    color: var(--ink-700); width: 100%;
  }
  .boxed:focus { outline: 0; box-shadow: var(--shadow-press); }

  /* Toggle — square slider */
  .toggle { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; }
  .toggle .track { width: 44px; height: 22px; background: var(--paper-200); border: 1.5px solid var(--ink-700); position: relative; }
  .toggle .thumb { position: absolute; top: 1px; left: 1px; width: 18px; height: 18px; background: var(--ink-700); transition: 240ms; }
  .toggle.on .track { background: var(--spot-700); }
  .toggle.on .thumb { left: 22px; background: var(--ink-700); }

  /* Radio sheet — square outlined cells */
  .radio-sheet { display: flex; gap: 0; border: 1.5px solid var(--ink-700); }
  .radio-sheet label { flex: 1; padding: 10px 14px;
    font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: -0.02em;
    cursor: pointer; text-align: center; border-right: 1.5px solid var(--ink-700); background: var(--paper-50); }
  .radio-sheet label:last-child { border-right: 0; }
  .radio-sheet label.selected { background: var(--ink-700); color: var(--paper-100); }

  /* Checkbox */
  .check { display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-body); font-size: 15px; }
  .check .box { width: 18px; height: 18px; border: 1.5px solid var(--ink-700); background: var(--paper-50); display: grid; place-items: center; }
  .check.on .box { background: var(--ink-700); }
  .check.on .box::after { content: '✓'; color: var(--paper-100); font-size: 13px; font-weight: 700; }
</style></head><body>
<h1>Form fields.</h1>
<div class="sub">Inputs sit on staff lines. Boxes get the misregistration shadow on focus.</div>

<div class="stack">
  <div class="field">
    <div class="lbl">RULED &mdash; default</div>
    <input class="ruled" placeholder="your full name" value="Marian Hill">
  </div>

  <div class="field">
    <div class="lbl">RULED &mdash; empty</div>
    <input class="ruled" placeholder="your full name">
  </div>

  <div class="field">
    <div class="lbl">BOXED &mdash; with focus</div>
    <input class="boxed" value="Tap a fret to log the note." style="box-shadow: var(--shadow-press);">
  </div>

  <div class="field">
    <div class="lbl">TOGGLE</div>
    <div style="display:flex; gap: 24px;">
      <span class="toggle on"><span class="track"><span class="thumb"></span></span><span style="font-size:14px;">Sound on</span></span>
      <span class="toggle"><span class="track"><span class="thumb"></span></span><span style="font-size:14px;">Reminders</span></span>
    </div>
  </div>

  <div class="field">
    <div class="lbl">RADIO SHEET &mdash; pick a tempo</div>
    <div class="radio-sheet">
      <label>SLOW</label>
      <label class="selected">STEADY</label>
      <label>SPRIGHTLY</label>
    </div>
  </div>

  <div class="field">
    <div class="lbl">CHECKBOX</div>
    <div style="display:flex; gap: 24px;">
      <span class="check on"><span class="box"></span>Daily reminder</span>
      <span class="check"><span class="box"></span>Send weekly recap</span>
    </div>
  </div>
</div>
</body></html>
